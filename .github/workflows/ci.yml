name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: test / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: docker build smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f apps/api/Dockerfile -t razorpay-recovery-api:ci .
      - run: docker build -f apps/web/Dockerfile -t razorpay-recovery-web:ci .
