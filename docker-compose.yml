services:
  db:
    image: postgres:16-alpine
    container_name: razorpay-recovery-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: razorpay_recovery
    ports:
      - "5432:5432"
    volumes:
      - razorpay_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: razorpay-recovery-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    container_name: razorpay-recovery-api
    env_file: .env
    environment:
      # Container networking requires service names; these override any
      # localhost-based values from .env so the app stack works as one unit.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/razorpay_recovery
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./apps/web
    container_name: razorpay-recovery-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  razorpay_db_data:
